name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest ragas trulens-eval

      - name: Run tests
        run: |
          cd backend
          pytest -v

      - name: Build Docker containers
        run: docker compose build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging (Simulated)
        run: |
          echo "Simulating SSH deployment to staging environment..."
          echo "Connecting to staging-server.semanticgraph.com..."
          echo "Running: cd /opt/semanticgraph && git pull && docker compose up -d --build"
          echo "Deployment simulation successful!"
