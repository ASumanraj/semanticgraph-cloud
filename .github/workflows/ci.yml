name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Note on Postgres service (T-213):
    # The postgres service container was removed. Integration tests in
    # tests/integration/adapters/postgres/ use testcontainers by default, providing
    # an isolated, fresh Postgres container per test module. An ambient job-level
    # service container was idle/unused (conftest only connects to compose if
    # SEMANTICGRAPH_USE_COMPOSE_DB=1 is set), wasted boot time, and polluted
    # the environment with DATABASE_URL.
    # SEMANTICGRAPH_REQUIRE_POSTGRES=1 is kept so testcontainers failures fail loudly.
    env:
      SEMANTICGRAPH_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test (fast suite — in-memory adapters)
        run: pytest -q

      - name: Isolation proofs (real Postgres, must not skip)
        run: |
          set -e -o pipefail
          pytest tests/integration/adapters/postgres/ \
            -v -rs \
            --tb=short \
            2>&1 | tee /tmp/isolation_output.txt
          # Fail the step if any test was skipped — a skip here means the
          # row-level-security proofs did not run, which is a silent pass.
          if grep -qE "^SKIPPED" /tmp/isolation_output.txt; then
            echo "ERROR: one or more isolation tests were skipped" >&2
            grep -E "^SKIPPED" /tmp/isolation_output.txt >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup virtualenv for E2E backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7
