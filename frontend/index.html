<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemanticGraph Cloud Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <header class="header">
            <h1>SemanticGraph Cloud</h1>
            <div class="header-actions">
                <button class="secondary-btn" commandfor="profile-menu" command="toggle-popover" aria-label="Profile Menu">Profile</button>
                <div id="profile-menu" popover>
                    <ul>
                        <li><a href="#">Settings</a></li>
                        <li><a href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>
        
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#ontology" class="active">Manage Ontology</a></li>
                    <li><a href="#documents">Documents</a></li>
                </ul>
            </nav>
            <div class="sidebar-actions">
                <button class="primary-btn" commandfor="upload-dialog" command="show-modal">Upload Document</button>
                <button class="secondary-btn" commandfor="ontology-dialog" command="show-modal">Create Ontology</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="ontology" class="content-section">
                <h2>Manage Ontology</h2>
                <div class="card-grid">
                    <!-- Cards representing ontology entities -->
                    <div class="card">
                        <h3>Person</h3>
                        <p>Entity describing a human being.</p>
                        <button class="action-btn">Edit</button>
                    </div>
                    <div class="card">
                        <h3>Organization</h3>
                        <p>Entity describing a company or group.</p>
                        <button class="action-btn">Edit</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <dialog id="upload-dialog">
        <h2>Upload Document</h2>
        <form method="dialog" id="upload-form">
            <div class="form-group">
                <label for="doc-file">Select file:</label>
                <input type="file" id="doc-file" name="doc-file" accept=".pdf,.txt,.docx" required>
            </div>
            <div class="form-actions">
                <button type="button" commandfor="upload-dialog" command="close">Cancel</button>
                <button type="submit" class="primary-btn">Upload</button>
            </div>
        </form>
    </dialog>

    <dialog id="ontology-dialog">
        <h2>Create Ontology</h2>
        <form method="dialog" id="ontology-form">
            <div class="form-group">
                <label for="ont-name">Entity Name:</label>
                <input type="text" id="ont-name" name="ont-name" required>
            </div>
            <div class="form-group">
                <label for="ont-desc">Description:</label>
                <textarea id="ont-desc" name="ont-desc" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" commandfor="ontology-dialog" command="close">Cancel</button>
                <button type="submit" class="primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
